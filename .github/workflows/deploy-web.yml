name: Web Validation

on:
  workflow_call:
    inputs:
      lint_non_blocking:
        description: Keep Web lint non-blocking while the Phase 8 baseline is red.
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      lint_non_blocking:
        description: Keep Web lint non-blocking while the Phase 8 baseline is red.
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    name: Build and lint Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keystone-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: keystone-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        id: lint
        continue-on-error: ${{ inputs.lint_non_blocking }}
        run: npm run lint

      - name: Report lint baseline
        if: steps.lint.outcome == 'failure' && inputs.lint_non_blocking
        run: |
          echo "::warning::Web lint failed but is temporarily non-blocking because Phase 8 documented a pre-existing baseline of 13 errors and 25 warnings."
