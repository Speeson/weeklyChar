name: Deploy Orchestrator

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base ref/SHA for changed-file detection; required for manual Client release.
        required: false
        type: string
      head_ref:
        description: Optional head ref/SHA. Defaults to the workflow SHA.
        required: false
        type: string
      deploy_worker:
        description: Deploy Worker after validation.
        required: false
        default: false
        type: boolean
      run_migrations:
        description: Run remote D1 migrations before Worker deploy.
        required: false
        default: false
        type: boolean
      build_client:
        description: Build Client artifact when Client impact is detected.
        required: false
        default: true
        type: boolean
      client_release_mode:
        description: Client release behavior for manual runs.
        required: false
        default: auto
        type: choice
        options:
          - auto
          - build-only
          - release-dry-run
          - release
      client_version_bump:
        description: Client release bump for release planning.
        required: false
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      confirm_release_scope:
        description: Confirm that base_ref/head_ref cover every change included in a manual Client release.
        required: false
        default: false
        type: boolean
      recover_worker_readiness:
        description: Re-run only authenticated Worker smoke before a guarded Client release recovery.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('keystonesync-validation-pr-{0}', github.event.pull_request.number) || 'keystonesync-production-orchestrator' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  impact:
    name: Deployment Impact
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.outputs.outputs.web }}
      worker: ${{ steps.outputs.outputs.worker }}
      db: ${{ steps.outputs.outputs.db }}
      client_build: ${{ steps.outputs.outputs.client_build }}
      client_release: ${{ steps.outputs.outputs.client_release }}
      addon: ${{ steps.outputs.outputs.addon }}
      addon_release: ${{ steps.outputs.outputs.addon_release }}
      publish_client: ${{ steps.outputs.outputs.publish_client }}
      deploy_worker: ${{ steps.outputs.outputs.deploy_worker }}
      run_migrations: ${{ steps.outputs.outputs.run_migrations }}
      smoke_worker: ${{ steps.outputs.outputs.smoke_worker }}
      worker_readiness_required: ${{ steps.outputs.outputs.worker_readiness_required }}
      unknown_paths: ${{ steps.outputs.outputs.unknown_paths }}
      changed_files: ${{ steps.outputs.outputs.changed_files }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed files
        id: changed
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          INPUT_BASE_REF: ${{ inputs.base_ref }}
          INPUT_HEAD_REF: ${{ inputs.head_ref }}
        run: |
          set -euo pipefail

          head="${CURRENT_SHA}"
          base=""

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base="${PR_BASE_SHA}"
            head="${PR_HEAD_SHA}"
          elif [[ "${EVENT_NAME}" == "push" ]]; then
            base="${PUSH_BEFORE}"
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            head="${INPUT_HEAD_REF:-${CURRENT_SHA}}"
            base="${INPUT_BASE_REF:-}"
          fi

          git fetch --no-tags --prune --depth=100 origin +refs/heads/*:refs/remotes/origin/* || true

          if ! git cat-file -e "${head}^{commit}" 2>/dev/null; then
            echo "Head ${head} is not available locally; falling back to checked-out HEAD."
            head="HEAD"
          fi

          if [[ -n "${base}" && "${base}" != "0000000000000000000000000000000000000000" ]] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git diff --name-only "${base}" "${head}" > changed-files.txt
          elif git rev-parse "${head}^" >/dev/null 2>&1; then
            git diff --name-only "${head}^" "${head}" > changed-files.txt
          else
            git diff-tree --no-commit-id --name-only -r "${head}" > changed-files.txt
          fi

          sort -u changed-files.txt -o changed-files.txt
          echo "Changed files:"
          cat changed-files.txt

      - name: Run Deployment Impact
        run: |
          python scripts/deploy_impact.py --stdin --json --strict --allow-empty < changed-files.txt > impact.json
          cat impact.json

      - name: Plan release orchestration
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          AUTO_RELEASE_ENABLED: ${{ vars.TAURI_CLIENT_RELEASE_ENABLED == 'true' }}
          INPUT_BASE_REF: ${{ inputs.base_ref }}
          CLIENT_RELEASE_MODE: ${{ inputs.client_release_mode || 'auto' }}
          DEPLOY_WORKER_REQUESTED: ${{ inputs.deploy_worker || false }}
          RUN_MIGRATIONS_REQUESTED: ${{ inputs.run_migrations || false }}
          CONFIRM_MANUAL_RELEASE_SCOPE: ${{ inputs.confirm_release_scope || false }}
          RECOVER_WORKER_READINESS: ${{ inputs.recover_worker_readiness || false }}
        run: |
          python scripts/release_orchestration.py plan \
            --impact-file impact.json \
            --event-name "$EVENT_NAME" \
            --ref "$EVENT_REF" \
            --auto-release-enabled "$AUTO_RELEASE_ENABLED" \
            --base-ref "$INPUT_BASE_REF" \
            --client-release-mode "$CLIENT_RELEASE_MODE" \
            --deploy-worker-requested "$DEPLOY_WORKER_REQUESTED" \
            --run-migrations-requested "$RUN_MIGRATIONS_REQUESTED" \
            --confirm-manual-release-scope "$CONFIRM_MANUAL_RELEASE_SCOPE" \
            --recover-worker-readiness-requested "$RECOVER_WORKER_READINESS" \
            > orchestration.json
          cat orchestration.json

      - name: Expose outputs
        id: outputs
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os

          with open("impact.json", encoding="utf-8") as handle:
              impact = json.load(handle)
          with open("orchestration.json", encoding="utf-8") as handle:
              orchestration = json.load(handle)
          with open("changed-files.txt", encoding="utf-8") as handle:
              changed_files = [line.strip() for line in handle if line.strip()]

          output_path = os.environ["GITHUB_OUTPUT"]
          with open(output_path, "a", encoding="utf-8") as out:
              for key in ("web", "worker", "db", "client_build", "client_release", "addon", "addon_release"):
                  out.write(f"{key}={str(impact[key]).lower()}\n")
              for key in ("publish_client", "deploy_worker", "run_migrations", "smoke_worker", "worker_readiness_required"):
                  out.write(f"{key}={str(orchestration[key]).lower()}\n")
              out.write(f"unknown_paths={json.dumps(impact['unknown_paths'])}\n")
              out.write(f"changed_files={json.dumps(changed_files)}\n")
          PY

      - name: Summarize impact
        shell: bash
        run: |
          {
            echo "## Deployment Impact"
            echo
            echo '```json'
            cat impact.json
            echo '```'
            echo
            echo '```json'
            cat orchestration.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  web:
    name: Web validation
    needs: impact
    if: needs.impact.outputs.web == 'true'
    uses: ./.github/workflows/deploy-web.yml
    with:
      lint_non_blocking: true

  worker:
    name: Worker validation/deploy
    needs: impact
    if: needs.impact.outputs.worker == 'true' || needs.impact.outputs.deploy_worker == 'true' || needs.impact.outputs.run_migrations == 'true' || needs.impact.outputs.smoke_worker == 'true'
    uses: ./.github/workflows/deploy-worker.yml
    with:
      deploy: ${{ needs.impact.outputs.deploy_worker == 'true' }}
      run_migrations: ${{ needs.impact.outputs.run_migrations == 'true' }}
      run_smoke: ${{ needs.impact.outputs.smoke_worker == 'true' }}
    secrets: inherit

  client-build:
    name: Client build
    needs: impact
    if: >
      (
        needs.impact.outputs.client_build == 'true' &&
        needs.impact.outputs.client_release != 'true' &&
        (github.event_name != 'workflow_dispatch' || inputs.build_client)
      ) ||
      (github.event_name == 'workflow_dispatch' && inputs.client_release_mode == 'build-only')
    uses: ./.github/workflows/build-client.yml

  client-release-pr:
    name: Client release plan
    needs: impact
    if: github.event_name == 'pull_request' && needs.impact.outputs.client_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Client changeset and planned release
        run: |
          python scripts/release_changes.py plan --component client --version-file keystone-client/VERSION --bump auto --notes-out release-notes.md --json > release-plan.json
          cat release-plan.json

      - name: Summarize planned release
        run: |
          {
            echo "## Planned KeystoneClient Release"
            echo
            echo '```json'
            cat release-plan.json
            echo '```'
            echo
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

  client-release-pr-build:
    name: Client release dry-run build
    needs:
      - impact
      - client-release-pr
    if: github.event_name == 'pull_request' && needs.impact.outputs.client_release == 'true'
    uses: ./.github/workflows/build-client.yml

  release-gate:
    name: Client publication backend gate
    needs:
      - impact
      - worker
    if: always() && needs.impact.result == 'success' && needs.impact.outputs.publish_client == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require backend readiness
        env:
          PUBLISH_CLIENT: ${{ needs.impact.outputs.publish_client }}
          WORKER_READINESS_REQUIRED: ${{ needs.impact.outputs.worker_readiness_required }}
          WORKER_RESULT: ${{ needs.worker.result }}
          PRODUCTION_READY: ${{ needs.worker.outputs.production_ready || false }}
        run: |
          python scripts/release_orchestration.py require-readiness \
            --publish-client "$PUBLISH_CLIENT" \
            --worker-readiness-required "$WORKER_READINESS_REQUIRED" \
            --worker-result "$WORKER_RESULT" \
            --production-ready "$PRODUCTION_READY"

  client-release:
    name: Client release
    needs:
      - impact
      - release-gate
    if: always() && needs.impact.outputs.publish_client == 'true' && needs.release-gate.result == 'success'
    permissions:
      contents: write
    uses: ./.github/workflows/release-client.yml
    secrets: inherit
    with:
      mode: release
      version_bump: ${{ inputs.client_version_bump || 'auto' }}
      release_gate_passed: true

  client-release-dry-run:
    name: Client release dry-run
    needs: impact
    if: github.event_name == 'workflow_dispatch' && inputs.client_release_mode == 'release-dry-run'
    permissions:
      contents: write
    uses: ./.github/workflows/release-client.yml
    secrets: inherit
    with:
      mode: release-dry-run
      version_bump: ${{ inputs.client_version_bump || 'auto' }}

  addon-impact:
    name: Addon release handoff
    needs: impact
    if: needs.impact.outputs.addon == 'true' || needs.impact.outputs.addon_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report addon impact
        run: |
          echo "::notice::Standalone KeystoneSync addon release required. Publish from Speeson/KeystoneSync; weeklyChar does not publish addon releases or build KeystoneClient for addon-only changes."
          echo "ADDON=${{ needs.impact.outputs.addon }}"
          echo "ADDON_RELEASE=${{ needs.impact.outputs.addon_release }}"
          echo "CLIENT_BUILD=${{ needs.impact.outputs.client_build }}"
          echo "CLIENT_RELEASE=${{ needs.impact.outputs.client_release }}"

  summary:
    name: Summary
    needs:
      - impact
      - web
      - worker
      - client-build
      - client-release-pr
      - client-release-pr-build
      - release-gate
      - client-release
      - client-release-dry-run
      - addon-impact
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Final summary
        run: |
          echo "Impact job: ${{ needs.impact.result }}"
          echo "Web job: ${{ needs.web.result }}"
          echo "Worker job: ${{ needs.worker.result }}"
          echo "Client build job: ${{ needs.client-build.result }}"
          echo "Client release plan job: ${{ needs.client-release-pr.result }}"
          echo "Client release dry-run build job: ${{ needs.client-release-pr-build.result }}"
          echo "Client publication backend gate: ${{ needs.release-gate.result }}"
          echo "Client release job: ${{ needs.client-release.result }}"
          echo "Client manual dry-run job: ${{ needs.client-release-dry-run.result }}"
          echo "Addon handoff job: ${{ needs.addon-impact.result }}"
          echo "Changed files: ${{ needs.impact.outputs.changed_files }}"
          echo "Unknown paths: ${{ needs.impact.outputs.unknown_paths }}"
