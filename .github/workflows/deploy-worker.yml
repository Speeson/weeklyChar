name: Worker Validation and Deploy

on:
  workflow_call:
    inputs:
      deploy:
        description: Deploy the Worker after validation.
        required: false
        default: false
        type: boolean
      run_migrations:
        description: Run remote D1 migrations before Worker deploy.
        required: false
        default: false
        type: boolean
      smoke_base_url:
        description: Production Worker base URL used after deployment.
        required: false
        default: https://api-keystonesync.esgarpe.dev
        type: string
    outputs:
      production_ready:
        description: True only after the deployed production API passes its smoke checks.
        value: ${{ jobs.smoke.outputs.production_ready }}
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck and test Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keystone-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: keystone-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  migrate:
    name: Remote D1 migrations
    needs: validate
    if: inputs.run_migrations
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: keystonesync-production-worker
      cancel-in-progress: false
    defaults:
      run:
        working-directory: keystone-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: keystone-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run remote D1 migrations
        run: npm run d1:migrate:remote

  deploy:
    name: Deploy Worker
    needs:
      - validate
      - migrate
    if: inputs.deploy && always() && needs.validate.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: keystonesync-production-worker
      cancel-in-progress: false
    defaults:
      run:
        working-directory: keystone-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: keystone-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Deploy Worker
        run: npm run deploy

  smoke:
    name: Smoke production Worker
    needs: deploy
    if: inputs.deploy && always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      production_ready: ${{ steps.ready.outputs.production_ready }}
    env:
      WORKER_BASE_URL: ${{ inputs.smoke_base_url }}
    steps:
      - name: Verify health and Selector authentication boundary
        id: ready
        shell: bash
        run: |
          set -euo pipefail
          base_url="${WORKER_BASE_URL%/}"
          if [[ "$base_url" != https://* ]]; then
            echo "Worker smoke URL must use HTTPS." >&2
            exit 1
          fi

          health_status="$(curl --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 30 --output health.json --write-out '%{http_code}' "$base_url/api/health")"
          if [[ "$health_status" != "200" ]]; then
            cat health.json >&2
            echo "Unexpected Worker health status: $health_status" >&2
            exit 1
          fi
          python -c "import json; payload=json.load(open('health.json', encoding='utf-8')); assert payload.get('status') == 'ok' and payload.get('service') == 'keystone-worker', payload"

          selector_status="$(curl --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 30 --output selector.json --write-out '%{http_code}' "$base_url/api/teams/1/keystone-loot/dungeons/249/summary")"
          if [[ "$selector_status" != "401" ]]; then
            cat selector.json >&2
            echo "Selector route was not recognized behind its authentication boundary: $selector_status" >&2
            exit 1
          fi
          python -c "import json; payload=json.load(open('selector.json', encoding='utf-8')); assert isinstance(payload.get('detail'), str) and payload['detail'], payload"
          echo "production_ready=true" >> "$GITHUB_OUTPUT"
